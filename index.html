<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Privacy – ROIDS Software</title>
  <style>
    :root { --bg: #080b18; --accent: #5e9eff; --text: #fafafa; --muted: #8a93b2; --border: #1e2540; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 60px 20px 80px; }
    .wrap { max-width: 680px; margin: 0 auto; }
    .eyebrow { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 2.5px; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; }
    h1 { font-size: 32px; font-weight: 400; font-family: Georgia, serif; margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid var(--border); }
    ul { list-style: none; padding: 0; }
    li a { display: block; padding: 18px 0; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 18px; }
    li a:hover { color: var(--accent); }
    li a span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; font-family: 'Courier New', monospace; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">ROIDS Software</div>
    <h1>Privacy Policies</h1>
    <ul>
      <li><a href="deep-into-space/">Deep Into Space<span>iOS — Space imagery &amp; NASA data</span></a></li>
    </ul>
  </div>
</body>
</html>
